name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to receive the built ZIP"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build
        run: python -m PyInstaller --noconfirm --clean ".\DD轨迹.spec"
      - uses: actions/upload-artifact@v4
        with:
          name: DD轨迹-windows
          path: dist/DD轨迹.exe
      - name: Package release ZIP
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $package = Join-Path $PWD "package/DD轨迹-Windows-$env:RELEASE_TAG"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item "dist/DD轨迹.exe" (Join-Path $package "DD轨迹.exe")
          Copy-Item "README.md" (Join-Path $package "README.md")
          Copy-Item "SECURITY.md" (Join-Path $package "SECURITY.md")
          Copy-Item "settings.example.json" (Join-Path $package "settings.example.json")
          $notes = "RELEASE-NOTES-$env:RELEASE_TAG.md"
          if (Test-Path $notes) {
            Copy-Item $notes (Join-Path $package $notes)
          }
          $sums = @()
          Get-ChildItem -LiteralPath $package -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $sums += "$hash  $($_.Name)"
          }
          $sumsPath = Join-Path $package "SHA256SUMS.txt"
          Set-Content -LiteralPath $sumsPath -Value ($sums -join "`n") -Encoding ascii
          $zip = Join-Path $PWD "package/DDTracker-Windows-$env:RELEASE_TAG.zip"
          if (Test-Path $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -LiteralPath "$zip.sha256" -Value "$zipHash  DDTracker-Windows-$env:RELEASE_TAG.zip" -Encoding ascii
          "ZIP_SHA256=$zipHash" >> $env:GITHUB_STEP_SUMMARY
          "EXE_SHA256=$((Get-FileHash 'dist/DD轨迹.exe' -Algorithm SHA256).Hash)" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $zip = "package/DDTracker-Windows-$env:RELEASE_TAG.zip"
          $notes = "RELEASE-NOTES-$env:RELEASE_TAG.md"
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $notes) {
              gh release create "$env:RELEASE_TAG" --title "DD轨迹 $env:RELEASE_TAG" --notes-file $notes
            } else {
              gh release create "$env:RELEASE_TAG" --generate-notes
            }
          }
          $assetName = [IO.Path]::GetFileName($zip)
          $hasZip = gh release view "$env:RELEASE_TAG" --json assets --jq ".assets[] | select(.name==\"$assetName\") | .name"
          if ($hasZip) {
            Write-Host "Release already has $assetName; keeping existing asset."
          } else {
            gh release upload "$env:RELEASE_TAG" $zip "$zip.sha256"
          }
